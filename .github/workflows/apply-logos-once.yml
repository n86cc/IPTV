name: Engangs-udfyldning af IPTV-logoer

# Engangs-workflow (28-10-2026): anvender .iptv-sync/logo-overrides.json på de committede
# lister og .iptv-sync/state (sync.py --logos-only). Kun tvg-logo-værdier ændres, og kun hvor
# logoet er tomt eller en kendt død URL. Alt andet bevares byte for byte. Filen slettes igen bagefter.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-logos-once.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-sync
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anvend logo-overrides
        run: python3 .iptv-sync/sync.py --logos-only
      - name: Tjek at kun tvg-logo er ændret, og at sync.py læser/skriver filerne uændret
        run: |
          python3 - <<'PY'
          import importlib.util, os, re, subprocess, sys
          sys.argv = ["x"]
          spec = importlib.util.spec_from_file_location("s", ".iptv-sync/sync.py")
          s = importlib.util.module_from_spec(spec); spec.loader.exec_module(s)
          strip = lambda t: re.sub(r'tvg-logo="[^"]*"', "", t)
          for n, cfg in s.TARGETS.items():
              main, gf = cfg.get("main", "All"), cfg.get("group_first", False)
              for p in (n, f".iptv-sync/state/{n}.base", f".iptv-sync/state/{n}.hidden"):
                  if not os.path.exists(p):
                      continue
                  t = open(p, encoding="utf-8", newline="").read()
                  old = subprocess.run(["git", "show", f"HEAD:{p}"], capture_output=True).stdout.decode("utf-8")
                  assert strip(t) == strip(old), p
                  nl = "\r\n" if "\r\n" in t else "\n"
                  h, u = s.units_from_target(t, cfg["cats"], main)
                  assert s.render(h, u, cfg["cats"], nl, main, gf) == t, p
                  print("ok", p, len(u), "tomme logoer:", t.count('tvg-logo=""'))
          PY
      - name: Commit og push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.m3u' .iptv-sync/state
          git diff --cached --stat
          git diff --cached --quiet && { echo "Intet at ændre."; exit 0; }
          git commit -m "IPTV: manglende/døde logoer udfyldt fra logo-overrides.json i lister og state (kun tvg-logo ændret)"
          git push
